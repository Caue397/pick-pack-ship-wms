spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/order/**
            - id: stock-service
              uri: ${STOCK_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/stock/**
            - id: picking-service
              uri: ${PICKING_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/picking/**
            - id: checking-service
              uri: ${CHECKING_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/checking/**
            - id: shipping-service
              uri: ${SHIPPING_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/shipping/**

server:
  port: ${SERVER_PORT:8080}

jwt:
  # HMAC-SHA256 requires >= 32 bytes. MUST match the signing key used by Auth Service.
  secret: ${JWT_SECRET:change-me-to-a-real-secret-shared-with-auth-service-min-32-bytes}
